<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAGIMI Token Launch</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HAGIMI Token" />
  <meta name="theme-color" content="#0f172a" />

  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(59,130,246,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(14,165,233,0.16), transparent 24%),
        linear-gradient(180deg, #08111f 0%, #0b1220 45%, #0f172a 100%);
      color: #e5eefc;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 880px;
      margin: auto;
      padding: 20px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .back-btn {
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.08);
      color: #e5eefc;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .card {
      background: rgba(17, 27, 46, 0.92);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    .sub {
      color: #9fb0cf;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 18px 0;
    }

    .mini-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      padding: 14px;
    }

    .mini-title {
      color: #9fb0cf;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .mini-value {
      font-size: 22px;
      font-weight: 800;
    }

    .bar {
      height: 12px;
      background: #1e293b;
      border-radius: 999px;
      overflow: hidden;
      margin: 14px 0 18px;
    }

    .fill {
      height: 100%;
      background: linear-gradient(90deg, #5fa8ff, #7dd3fc);
      width: 0%;
      transition: width 0.25s ease;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255,255,255,0.04);
      color: #e5eefc;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #94a3b8;
    }

    button.buy {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #5fa8ff, #7dd3fc);
      color: #08111f;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .note {
      margin-top: 15px;
      font-size: 12px;
      color: #9fb0cf;
      line-height: 1.5;
    }

    .status {
      margin-top: 12px;
      color: #cbd5e1;
      min-height: 20px;
      font-size: 14px;
    }

    .story {
      color: #cbd5e1;
      line-height: 1.6;
      margin-top: 10px;
      margin-bottom: 14px;
    }

    @media (max-width: 720px) {
      h1 {
        font-size: 24px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .container {
        padding: 14px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">← Back to Marketplace</button>
  </div>

  <div class="card">
    <h1 id="projectName">Project</h1>
    <div id="projectSub" class="sub"></div>
    <div id="projectStory" class="story"></div>

    <div class="grid">
      <div class="mini-card">
        <div class="mini-title">Total Value</div>
        <div class="mini-value" id="totalValue">£0</div>
      </div>

      <div class="mini-card">
        <div class="mini-title">Token Supply</div>
        <div class="mini-value" id="tokenSupply">0</div>
      </div>

      <div class="mini-card">
        <div class="mini-title">Price per Token</div>
        <div class="mini-value"><span id="price">£1.00</span></div>
      </div>

      <div class="mini-card">
        <div class="mini-title">Sale Ends In</div>
        <div class="mini-value"><span id="timer">05:00</span></div>
      </div>

      <div class="mini-card">
        <div class="mini-title">Sold</div>
        <div class="mini-value"><span id="sold">0</span></div>
      </div>

      <div class="mini-card">
        <div class="mini-title">Available</div>
        <div class="mini-value"><span id="available">0</span></div>
      </div>

      <div class="mini-card">
        <div class="mini-title">Suitability</div>
        <div class="mini-value"><span id="suitabilityScore">0</span>/10</div>
      </div>

      <div class="mini-card">
        <div class="mini-title">Classification</div>
        <div class="mini-value" id="suitabilityLabel">-</div>
      </div>
    </div>

    <div class="bar">
      <div id="fill" class="fill"></div>
    </div>

    <input id="amount" type="number" placeholder="Enter token amount" min="1">

    <button class="buy" onclick="buy()">Buy Tokens</button>

    <div id="status" class="status"></div>

    <div class="note">
      Demo only. No real transaction. This page is for presentation and product demonstration purposes only.
    </div>
  </div>
</div>

<script src="projects.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const projectId = params.get("project");
  const project = getProjectById(projectId);

  let total = project.tokenSupply;
  let sold = project.sold;
  let price = calculateTokenPrice(project);
  let time = 300;

  function goBack() {
    window.location.href = "marketplace.html";
  }

  function renderProject() {
    document.getElementById("projectName").innerText = project.name;
    document.getElementById("projectSub").innerText =
      `${project.distillery} · ${project.vintage} · ${project.caskType} · ${project.abv} · ${project.estimatedBottles} bottles · ${project.targetMarket}`;
    document.getElementById("projectStory").innerText = project.story;
    document.getElementById("totalValue").innerText = formatCurrencyGBP(project.totalValue);
    document.getElementById("tokenSupply").innerText = project.tokenSupply.toLocaleString();
    document.getElementById("suitabilityScore").innerText = project.suitabilityScore;
    document.getElementById("suitabilityLabel").innerText = project.suitabilityLabel;
  }

  function updateUI() {
    document.getElementById("sold").innerText = sold.toLocaleString();
    document.getElementById("available").innerText = (total - sold).toLocaleString();

    const percent = (sold / total) * 100;
    document.getElementById("fill").style.width = percent + "%";

    price = 1 + (percent / 100) * 0.6;
    document.getElementById("price").innerText = "£" + price.toFixed(2);
  }

  function buy() {
    const amountInput = document.getElementById("amount");
    const status = document.getElementById("status");
    let amount = parseInt(amountInput.value, 10);

    if (!amount || amount <= 0) {
      status.innerText = "Please enter a valid token amount.";
      return;
    }

    if (sold + amount > total) {
      status.innerText = "Not enough tokens available.";
      return;
    }

    if (amount > 10000) {
      status.innerText = "Whale detected. Large allocation request recorded.";
    } else {
      status.innerText = "Demo purchase completed successfully.";
    }

    sold += amount;
    amountInput.value = "";
    updateUI();
  }

  setInterval(() => {
    if (time > 0) {
      time--;
      let min = Math.floor(time / 60);
      let sec = time % 60;
      document.getElementById("timer").innerText =
        min + ":" + (sec < 10 ? "0" : "") + sec;
    }
  }, 1000);

  renderProject();
  updateUI();
</script>

</body>
</html>
