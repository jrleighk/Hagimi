<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAGIMI</title>

<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #0b1220;
    color: #e5eefc;
  }

  .container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
  }

  h1 {
    text-align: center;
  }

  textarea {
    width: 100%;
    height: 120px;
    border-radius: 12px;
    border: none;
    padding: 12px;
    font-size: 16px;
  }

  button {
    padding: 12px;
    border: none;
    border-radius: 10px;
    margin: 5px;
    cursor: pointer;
  }

  .primary {
    background: #5fa8ff;
    color: #08111f;
    width: 100%;
    margin-top: 10px;
  }

  .actions {
    margin-top: 10px;
    text-align: center;
  }

  .btn-secondary {
    background: #1e293b;
    color: #cbd5e1;
  }

  .output {
    margin-top: 20px;
    background: #111b2e;
    padding: 15px;
    border-radius: 12px;
    white-space: pre-wrap;
  }
</style>
</head>

<body>

<div class="container">
  <h1>HAGIMI</h1>

  <textarea id="input" placeholder="Enter whisky or crypto info..."></textarea>

  <button class="primary" onclick="send()">Analyze</button>

  <div class="actions">
    <button class="btn-secondary" onclick="fillExample()">Example</button>
    <button class="btn-secondary" onclick="openTokenPage()">Token Launch</button>
    <button class="btn-secondary" onclick="clearChat()">Clear</button>
  </div>

  <div id="output" class="output">Output will appear here...</div>
</div>

<script>

function openTokenPage() {
  window.open("token.html", "_blank");
}

function fillExample() {
  document.getElementById("input").value =
    "Macallan 1990 sherry cask 285 bottles cost 1150 GBP";
}

function clearChat() {
  document.getElementById("output").innerText = "";
}

async function send() {
  let text = document.getElementById("input").value;

  if (!text) {
    alert("Enter something");
    return;
  }

  document.getElementById("output").innerText = "Analyzing...";

  try {
    let res = await fetch("YOUR_WEBHOOK_URL_HERE", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ msg: text })
    });

    let data = await res.json();

    document.getElementById("output").innerText =
      data.choices?.[0]?.message?.content || "No response";

  } catch (e) {
    document.getElementById("output").innerText = "Error: " + e.message;
  }
}

</script>

</body>
</html>
