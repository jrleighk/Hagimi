<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAGIMI Token Launch</title>

<style>
body{
margin:0;
background:linear-gradient(180deg,#08111f,#0f172a);
color:#e5eefc;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
.container{max-width:900px;margin:auto;padding:20px;}
.card{
background:#111b2e;
padding:22px;
border-radius:20px;
}
h1{margin:0 0 10px;font-size:28px;}
.sub{color:#9fb0cf;margin-bottom:14px;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mini{background:#1e293b;padding:12px;border-radius:12px;}
.label{font-size:12px;color:#9fb0cf;}
.value{font-size:20px;font-weight:800;}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #334155;
background:#0b1220;
color:#fff;
}

button{
width:100%;
margin-top:10px;
padding:14px;
border-radius:12px;
border:none;
font-weight:700;
cursor:pointer;
}

.primary{background:#5fa8ff;color:#08111f;}
.secondary{background:#1e293b;color:#fff;}

.bar{height:10px;background:#1e293b;border-radius:999px;margin:12px 0;}
.fill{height:100%;background:#5fa8ff;width:0%;}

.topbar{display:flex;justify-content:space-between;margin-bottom:12px;}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
<button onclick="goBack()">←</button>
<button onclick="toggleLang()" id="langBtn">中文 / EN</button>
</div>

<div class="card">

<h1 id="title"></h1>
<div class="sub" id="sub"></div>

<div class="grid">
<div class="mini"><div class="label" id="l1"></div><div class="value" id="v1"></div></div>
<div class="mini"><div class="label" id="l2"></div><div class="value" id="v2"></div></div>
<div class="mini"><div class="label" id="l3"></div><div class="value" id="price"></div></div>
<div class="mini"><div class="label" id="l4"></div><div class="value" id="sold"></div></div>
</div>

<div class="bar"><div id="fill" class="fill"></div></div>

<input id="amount" placeholder="">
<button class="primary" onclick="buy()" id="buyBtn"></button>
<button class="secondary" onclick="scrollToForm()" id="reqBtn"></button>

<div id="status"></div>

<hr>

<h3 id="formTitle"></h3>

<input id="name" placeholder="">
<input id="contact" placeholder="">
<input id="qty" placeholder="">
<textarea id="notes" placeholder=""></textarea>

<button class="primary" onclick="submit()" id="submitBtn"></button>

<div id="formStatus"></div>

</div>
</div>

<script src="projects.js"></script>
<script>

let lang = localStorage.getItem("hagimi_lang") || "en";

const t = {
en:{
l1:"Total Value",
l2:"Token Supply",
l3:"Price",
l4:"Sold",
buy:"Buy Tokens",
req:"Request Allocation",
name:"Your Name",
contact:"Contact",
qty:"Amount",
notes:"Notes",
submit:"Submit",
formTitle:"Request Allocation"
},
zh:{
l1:"总价值",
l2:"Token总量",
l3:"价格",
l4:"已售",
buy:"购买Token",
req:"登记认购",
name:"姓名",
contact:"联系方式",
qty:"认购数量",
notes:"备注",
submit:"提交",
formTitle:"认购登记"
}
};

function apply(){
let tr=t[lang];

document.getElementById("l1").innerText=tr.l1;
document.getElementById("l2").innerText=tr.l2;
document.getElementById("l3").innerText=tr.l3;
document.getElementById("l4").innerText=tr.l4;

document.getElementById("buyBtn").innerText=tr.buy;
document.getElementById("reqBtn").innerText=tr.req;

document.getElementById("name").placeholder=tr.name;
document.getElementById("contact").placeholder=tr.contact;
document.getElementById("qty").placeholder=tr.qty;
document.getElementById("notes").placeholder=tr.notes;

document.getElementById("submitBtn").innerText=tr.submit;
document.getElementById("formTitle").innerText=tr.formTitle;
}

function toggleLang(){
lang=lang==="en"?"zh":"en";
localStorage.setItem("hagimi_lang",lang);
apply();
}

const p=new URLSearchParams(location.search);
const project=getProjectById(p.get("project"));

document.getElementById("title").innerText=project.name;
document.getElementById("sub").innerText=project.story;
document.getElementById("v1").innerText="£"+project.totalValue;
document.getElementById("v2").innerText=project.tokenSupply;

let sold=project.sold;
let total=project.tokenSupply;

function update(){
document.getElementById("sold").innerText=sold;
document.getElementById("price").innerText="£"+(1+(sold/total)*0.6).toFixed(2);
document.getElementById("fill").style.width=(sold/total*100)+"%";
}

function buy(){
let a=parseInt(document.getElementById("amount").value);
if(!a)return;
sold+=a;
update();
}

function scrollToForm(){
window.scrollTo({top:1000,behavior:"smooth"});
}

function submit(){
document.getElementById("formStatus").innerText="Submitted (Demo)";
}

function goBack(){
location.href="marketplace.html";
}

apply();
update();

</script>

</body>
</html>
