<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>HAGIMI</title>

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HAGIMI" />
  <meta name="theme-color" content="#0f172a" />

  <link rel="apple-touch-icon" href="hagimi-icon.png" />
  <link rel="icon" type="image/png" href="hagimi-icon.png" />

  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(15, 23, 42, 0.88);
      --text: #e5eefc;
      --muted: #9fb0cf;
      --border: rgba(148, 163, 184, 0.18);
      --accent: #5fa8ff;
      --accent-2: #7dd3fc;
      --user: #1e293b;
      --assistant: #132238;
      --shadow: 0 16px 40px rgba(0,0,0,0.28);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(59,130,246,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(14,165,233,0.16), transparent 24%),
        linear-gradient(180deg, #08111f 0%, #0b1220 45%, #0f172a 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .app {
      max-width: 980px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(10, 17, 31, 0.72);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: #0f172a;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.26);
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      transition: 0.18s ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #08111f;
    }

    .btn-primary:hover {
      filter: brightness(1.05);
    }

    .btn-secondary {
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255,255,255,0.08);
    }

    .shell {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid var(--border);
      background: rgba(10, 17, 31, 0.76);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .shell-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      background: rgba(255,255,255,0.02);
    }

    .chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .row {
      display: flex;
      width: 100%;
    }

    .row.user {
      justify-content: flex-end;
    }

    .row.assistant {
      justify-content: flex-start;
    }

    .message-wrap {
      max-width: min(78ch, 92%);
    }

    .bubble {
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
      font-size: 15px;
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .bubble.user {
      background: var(--user);
      border-bottom-right-radius: 6px;
    }

    .bubble.assistant {
      background: var(--assistant);
      border-bottom-left-radius: 6px;
    }

    .meta {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px;
      background: rgba(255,255,255,0.02);
    }

    textarea {
      width: 100%;
      min-height: 92px;
      max-height: 220px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.55;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    textarea:focus {
      border-color: rgba(125, 211, 252, 0.55);
      box-shadow: 0 0 0 4px rgba(125, 211, 252, 0.1);
      background: rgba(255,255,255,0.04);
    }

    .composer-actions {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
    }

    .right-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status {
      min-height: 18px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: #7dd3fc;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0.65); opacity: 0.6; }
      40% { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 720px) {
      .app {
        padding: 10px;
      }

      .topbar {
        padding: 14px;
        border-radius: 18px;
      }

      .title {
        font-size: 24px;
      }

      .bubble {
        font-size: 14px;
        max-width: 100%;
      }

      .composer-actions {
        flex-direction: column;
        align-items: stretch;
      }

      .right-actions {
        width: 100%;
      }

      .right-actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <img class="brand-icon" src="hagimi-icon.png" alt="HAGIMI icon" />
        <div class="brand-text">
          <h1 class="title" id="titleText">HAGIMI</h1>
          <p class="subtitle" id="subtitleText">Blue Cat Advisor · Whisky Cask Pricing · Deal Assistant · Token Structuring · Local History</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn-secondary" onclick="fillExample()" id="btnExample">Use example</button>
        <button class="btn-secondary" onclick="openTokenPage()" id="btnToken">Token Launch</button>
        <button class="btn-secondary" onclick="openMarketplacePage()" id="btnMarketplace">Marketplace</button>
        <button class="btn-secondary" onclick="copyLastReply()" id="btnCopy">Copy last reply</button>
        <button class="btn-secondary" onclick="exportHistory()" id="btnExport">Export history</button>
        <button class="btn-secondary" onclick="clearChat()" id="btnClear">Clear chat</button>
        <button class="btn-secondary" onclick="toggleLanguage()" id="btnLang">中文 / EN</button>
      </div>
    </div>

    <div class="shell">
      <div class="shell-header" id="headerText">
        Your chat history is stored on this device. Reopening this page on the same phone/browser will keep your records.
      </div>

      <div id="chat" class="chat"></div>

      <div class="composer">
        <textarea id="input" placeholder="Type your cask, bottle, or crypto details here..."></textarea>

        <div class="composer-actions">
          <div class="hint" id="hintText">Press Enter to send · Shift + Enter for a new line</div>
          <div class="right-actions">
            <button class="btn-primary" onclick="sendMessage()" id="btnSend">Send</button>
          </div>
        </div>

        <div id="status" class="status"></div>
      </div>
    </div>
  </div>

  <script>
    const webhookUrl = "https://hook.eu1.make.com/q7aux9niyxc179nk1vjj9fuyr9o7wg86?msg=";
    const storageKey = "hagimi_chat_history_v7";
    const languageKey = "hagimi_lang";

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const statusEl = document.getElementById("status");

    let lastAssistantReply = "";
    let currentLang = localStorage.getItem(languageKey) || "en";

    const translations = {
      en: {
        subtitle: "Blue Cat Advisor · Whisky Cask Pricing · Deal Assistant · Token Structuring · Local History",
        header: "Your chat history is stored on this device. Reopening this page on the same phone/browser will keep your records.",
        placeholder: "Type your cask, bottle, or crypto details here...",
        hint: "Press Enter to send · Shift + Enter for a new line",
        example: "Use example",
        token: "Token Launch",
        marketplace: "Marketplace",
        copy: "Copy last reply",
        export: "Export history",
        clear: "Clear chat",
        send: "Send",
        lang: "中文 / EN",
        welcome: "Hello. I am HAGIMI, your blue cat advisor for whisky cask pricing, bottle analysis, deal filtering, market positioning, token structuring, and commercial strategy. Send me your asset details and I will analyze them for you.",
        welcomeLabel: "HAGIMI",
        empty: "Please enter your asset details.",
        sending: "Sending request...",
        analyzing: "HAGIMI is analyzing",
        received: "Reply received.",
        copied: "Last reply copied.",
        copyFail: "Copy failed. Please copy manually.",
        noReply: "There is no assistant reply to copy yet.",
        noHistory: "There is no history to export.",
        exported: "History exported.",
        cleared: "Chat history cleared.",
        requestFail: "Request failed. Please check your network or Make scenario status."
      },
      zh: {
        subtitle: "蓝猫顾问 · 威士忌酒桶定价 · 成交辅助 · Token结构 · 本地记录",
        header: "聊天记录会保存在当前设备中。下次用同一台手机或浏览器打开时，记录仍会保留。",
        placeholder: "请输入酒桶、单瓶威士忌或加密货币信息...",
        hint: "按 Enter 发送 · Shift + Enter 换行",
        example: "示例",
        token: "Token发售",
        marketplace: "市场",
        copy: "复制上一条回复",
        export: "导出记录",
        clear: "清空聊天",
        send: "发送",
        lang: "中文 / EN",
        welcome: "你好，我是 HAGIMI，你的蓝猫顾问，可协助进行威士忌酒桶定价、单瓶分析、成交判断、市场定位、Token结构设计与商业策略分析。把资产信息发给我，我会帮你分析。",
        welcomeLabel: "HAGIMI",
        empty: "请输入你的资产信息。",
        sending: "正在发送请求...",
        analyzing: "HAGIMI 正在分析",
        received: "已收到回复。",
        copied: "已复制上一条回复。",
        copyFail: "复制失败，请手动复制。",
        noReply: "目前没有可复制的回复。",
        noHistory: "没有可导出的记录。",
        exported: "已导出记录。",
        cleared: "聊天记录已清空。",
        requestFail: "请求失败，请检查网络或 Make 场景状态。"
      }
    };

    inputEl.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    function applyLanguage() {
      const t = translations[currentLang];

      document.getElementById("subtitleText").innerText = t.subtitle;
      document.getElementById("headerText").innerText = t.header;
      document.getElementById("input").placeholder = t.placeholder;
      document.getElementById("hintText").innerText = t.hint;
      document.getElementById("btnExample").innerText = t.example;
      document.getElementById("btnToken").innerText = t.token;
      document.getElementById("btnMarketplace").innerText = t.marketplace;
      document.getElementById("btnCopy").innerText = t.copy;
      document.getElementById("btnExport").innerText = t.export;
      document.getElementById("btnClear").innerText = t.clear;
      document.getElementById("btnSend").innerText = t.send;
      document.getElementById("btnLang").innerText = t.lang;
    }

    function toggleLanguage() {
      currentLang = currentLang === "en" ? "zh" : "en";
      localStorage.setItem(languageKey, currentLang);
      applyLanguage();
      renderHistory();
    }

    function openTokenPage() {
      window.location.href = "token.html";
    }

    function openMarketplacePage() {
      window.location.href = "marketplace.html";
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem(storageKey, JSON.stringify(history));
    }

    function appendToHistory(role, text) {
      const history = getHistory();
      history.push({
        role,
        text,
        time: new Date().toLocaleString()
      });
      saveHistory(history);
    }

    function addMessageToDOM(role, text, label) {
      const row = document.createElement("div");
      row.className = `row ${role}`;

      const wrap = document.createElement("div");
      wrap.className = "message-wrap";

      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = text;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = label;

      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      row.appendChild(wrap);
      chatEl.appendChild(row);
    }

    function renderHistory() {
      const history = getHistory();
      const t = translations[currentLang];
      chatEl.innerHTML = "";

      if (!history.length) {
        addMessageToDOM("assistant", t.welcome, t.welcomeLabel);
        chatEl.scrollTop = chatEl.scrollHeight;
        return;
      }

      history.forEach(item => {
        addMessageToDOM(item.role, item.text, item.role === "user" ? "You" : "HAGIMI");
        if (item.role === "assistant") {
          lastAssistantReply = item.text;
        }
      });

      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addMessage(role, text) {
      addMessageToDOM(role, text, role === "user" ? "You" : "HAGIMI");
      appendToHistory(role, text);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function addTypingIndicator() {
      const t = translations[currentLang];

      const row = document.createElement("div");
      row.className = "row assistant";
      row.id = "typingRow";

      const wrap = document.createElement("div");
      wrap.className = "message-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble assistant";
      bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = t.analyzing;

      wrap.appendChild(bubble);
      wrap.appendChild(meta);
      row.appendChild(wrap);
      chatEl.appendChild(row);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeTypingIndicator() {
      const typing = document.getElementById("typingRow");
      if (typing) typing.remove();
    }

    function fillExample() {
      inputEl.value = "Macallan 1990 sherry cask, bottled in 2026, ABV 51.5%, estimated 285 bottles, cost 1150 GBP per bottle, cask price 327750 GBP, target Hong Kong and Mainland China";
      inputEl.focus();
    }

    function clearChat() {
      const t = translations[currentLang];
      localStorage.removeItem(storageKey);
      lastAssistantReply = "";
      statusEl.textContent = t.cleared;
      inputEl.value = "";
      renderHistory();
      inputEl.focus();
    }

    async function sendMessage() {
      const t = translations[currentLang];
      const input = inputEl.value.trim();

      if (!input) {
        statusEl.textContent = t.empty;
        return;
      }

      addMessage("user", input);
      inputEl.value = "";
      inputEl.focus();
      statusEl.textContent = t.sending;
      addTypingIndicator();

      try {
        const response = await fetch(webhookUrl + encodeURIComponent(input), {
          method: "GET"
        });

        const data = await response.text();

        removeTypingIndicator();
        addMessage("assistant", data);
        lastAssistantReply = data;
        statusEl.textContent = t.received;
      } catch (error) {
        removeTypingIndicator();
        const err = t.requestFail;
        addMessage("assistant", err);
        lastAssistantReply = err;
        statusEl.textContent = t.requestFail;
      }
    }

    async function copyLastReply() {
      const t = translations[currentLang];

      if (!lastAssistantReply) {
        statusEl.textContent = t.noReply;
        return;
      }

      try {
        await navigator.clipboard.writeText(lastAssistantReply);
        statusEl.textContent = t.copied;
      } catch (error) {
        statusEl.textContent = t.copyFail;
      }
    }

    function exportHistory() {
      const t = translations[currentLang];
      const history = getHistory();

      if (!history.length) {
        statusEl.textContent = t.noHistory;
        return;
      }

      const content = history
        .map(item => `[${item.time}] ${item.role === "user" ? "You" : "HAGIMI"}:\n${item.text}\n`)
        .join("\n--------------------------------\n\n");

      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "hagimi-history.txt";
      a.click();

      URL.revokeObjectURL(url);
      statusEl.textContent = t.exported;
    }

    applyLanguage();
    renderHistory();
  </script>
</body>
</html>
