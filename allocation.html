<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAGIMI Allocation</title>

<style>
body{
margin:0;
background:linear-gradient(180deg,#08111f,#0f172a);
color:#e5eefc;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
max-width:760px;
margin:auto;
padding:20px;
}

.card{
background:#111b2e;
padding:22px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:12px;
}

h1{margin:0 0 8px;font-size:26px;}
.sub{color:#9fb0cf;margin-bottom:16px;line-height:1.6;}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:12px;
}

.mini{
background:#1e293b;
padding:12px;
border-radius:12px;
}

.label{font-size:12px;color:#9fb0cf;}
.value{font-size:18px;font-weight:800;line-height:1.4;}

.bar{
height:10px;
background:#1e293b;
border-radius:999px;
margin:12px 0;
}

.fill{
height:100%;
background:#5fa8ff;
width:0%;
}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #334155;
background:#0b1220;
color:#fff;
}

textarea{min-height:100px;}

button{
width:100%;
margin-top:12px;
padding:14px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.primary{background:#5fa8ff;color:#08111f;}
.secondary{background:#1e293b;color:#fff;}

.status{
margin-top:12px;
color:#cbd5e1;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
<button onclick="goBack()">←</button>
<button onclick="toggleLang()" id="langBtn">中文 / EN</button>
</div>

<div class="card">

<h1 id="title"></h1>
<div class="sub" id="subtitle"></div>

<div class="grid">
<div class="mini"><div class="label" id="l1"></div><div class="value" id="v1"></div></div>
<div class="mini"><div class="label" id="l2"></div><div class="value" id="v2"></div></div>
<div class="mini"><div class="label" id="l3"></div><div class="value" id="price"></div></div>
<div class="mini"><div class="label" id="l4"></div><div class="value" id="sold"></div></div>
</div>

<div class="bar"><div id="fill" class="fill"></div></div>

<input id="name" placeholder="">
<input id="contact" placeholder="">
<input id="amount" placeholder="">
<textarea id="notes" placeholder=""></textarea>

<button class="primary" onclick="submit()" id="submitBtn"></button>
<button class="secondary" onclick="goBack()" id="backBtn"></button>

<div id="status" class="status"></div>

</div>
</div>

<script src="projects.js"></script>
<script>

const webhookUrl = "YOUR_MAKE_WEBHOOK_URL_HERE";
const GBP_TO_USD = 1.27;

let lang = localStorage.getItem("hagimi_lang") || "en";

const t = {
en:{
l1:"Total Value",
l2:"Token Supply",
l3:"Token Price",
l4:"Sold",
sub:"Submit your allocation request for this whisky-backed asset.",
name:"Your Name",
contact:"WhatsApp / WeChat / Email",
amount:"Requested Token Amount",
notes:"Notes",
submit:"Submit Allocation",
back:"Back",
success:"Allocation submitted successfully",
loading:"Submitting..."
},
zh:{
l1:"总价值",
l2:"Token总量",
l3:"Token价格",
l4:"已售",
sub:"提交该威士忌资产的认购申请",
name:"姓名",
contact:"联系方式（微信/电话/邮箱）",
amount:"认购Token数量",
notes:"备注",
submit:"提交认购",
back:"返回",
success:"提交成功",
loading:"提交中..."
}
};

function apply(){
let tr=t[lang];

document.getElementById("subtitle").innerText=tr.sub;

document.getElementById("l1").innerText=tr.l1;
document.getElementById("l2").innerText=tr.l2;
document.getElementById("l3").innerText=tr.l3;
document.getElementById("l4").innerText=tr.l4;

document.getElementById("name").placeholder=tr.name;
document.getElementById("contact").placeholder=tr.contact;
document.getElementById("amount").placeholder=tr.amount;
document.getElementById("notes").placeholder=tr.notes;

document.getElementById("submitBtn").innerText=tr.submit;
document.getElementById("backBtn").innerText=tr.back;
}

function toggleLang(){
lang=lang==="en"?"zh":"en";
localStorage.setItem("hagimi_lang",lang);
apply();
update();
}

const params = new URLSearchParams(window.location.search);
const project = getProjectById(params.get("project"));

document.getElementById("title").innerText = project.name;

let sold = project.sold;
let total = project.tokenSupply;

function update(){

const totalUSD = project.totalValue * GBP_TO_USD;

const tokenPriceGBP = 1 + (sold / total) * 0.6;
const tokenPriceUSD = tokenPriceGBP * GBP_TO_USD;
const tokenPriceUSDT = tokenPriceUSD;

document.getElementById("v1").innerHTML =
  "£" + project.totalValue.toLocaleString() +
  "<br>$" + totalUSD.toLocaleString(undefined,{maximumFractionDigits:0});

document.getElementById("v2").innerText = total.toLocaleString();

document.getElementById("sold").innerText = sold.toLocaleString();

document.getElementById("price").innerHTML =
  "£" + tokenPriceGBP.toFixed(2) +
  "<br>$" + tokenPriceUSD.toFixed(2) +
  " / " + tokenPriceUSDT.toFixed(2) + " USDT";

document.getElementById("fill").style.width = (sold / total * 100) + "%";
}

async function submit(){

const tr=t[lang];

const name = document.getElementById("name").value.trim();
const contact = document.getElementById("contact").value.trim();
const amount = document.getElementById("amount").value.trim();
const notes = document.getElementById("notes").value.trim();

const status = document.getElementById("status");

if(!name || !contact || !amount){
status.innerText="Please complete required fields";
return;
}

status.innerText = tr.loading;

try{

await fetch(webhookUrl,{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
project_id:project.id,
project_name:project.name,
name,
contact,
requested_amount:amount,
notes
})
});

status.innerText = tr.success;

document.getElementById("name").value="";
document.getElementById("contact").value="";
document.getElementById("amount").value="";
document.getElementById("notes").value="";

}catch(e){
status.innerText="Error";
}

}

function goBack(){
location.href="marketplace.html";
}

apply();
update();

</script>

</body>
</html>
