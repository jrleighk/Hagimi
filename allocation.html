<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAGIMI Allocation</title>

<style>
body{
margin:0;
background:linear-gradient(180deg,#08111f,#0f172a);
color:#e5eefc;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

.card{
background:#111b2e;
padding:22px;
border-radius:20px;
}

h1{margin:0 0 10px;font-size:26px;}
.sub{color:#9fb0cf;margin-bottom:14px;}

input,textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #334155;
background:#0b1220;
color:#fff;
}

textarea{min-height:100px;}

button{
width:100%;
margin-top:12px;
padding:14px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.primary{background:#5fa8ff;color:#08111f;}
.secondary{background:#1e293b;color:#fff;}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:12px;
}

.status{
margin-top:10px;
color:#cbd5e1;
}
</style>
</head>

<body>

<div class="container">

<div class="topbar">
<button onclick="goBack()">←</button>
<button onclick="toggleLang()" id="langBtn">中文 / EN</button>
</div>

<div class="card">

<h1 id="title"></h1>
<div class="sub" id="subtitle"></div>

<input id="name" placeholder="">
<input id="contact" placeholder="">
<input id="amount" placeholder="">
<textarea id="notes" placeholder=""></textarea>

<button class="primary" onclick="submit()" id="submitBtn"></button>
<button class="secondary" onclick="goBack()" id="backBtn"></button>

<div id="status" class="status"></div>

</div>
</div>

<script src="projects.js"></script>
<script>

const webhookUrl = "YOUR_MAKE_WEBHOOK_URL_HERE";

let lang = localStorage.getItem("hagimi_lang") || "en";

const t = {
en:{
title:"Request Allocation",
sub:"Submit your interest for this whisky asset.",
name:"Your Name",
contact:"WhatsApp / WeChat / Email",
amount:"Requested Amount",
notes:"Notes",
submit:"Submit Request",
back:"Back",
success:"Submitted successfully",
error:"Submission failed"
},
zh:{
title:"认购登记",
sub:"提交你的认购意向",
name:"姓名",
contact:"联系方式（微信/电话/邮箱）",
amount:"认购数量",
notes:"备注",
submit:"提交",
back:"返回",
success:"提交成功",
error:"提交失败"
}
};

function apply(){
let tr=t[lang];

document.getElementById("title").innerText=tr.title;
document.getElementById("subtitle").innerText=tr.sub;

document.getElementById("name").placeholder=tr.name;
document.getElementById("contact").placeholder=tr.contact;
document.getElementById("amount").placeholder=tr.amount;
document.getElementById("notes").placeholder=tr.notes;

document.getElementById("submitBtn").innerText=tr.submit;
document.getElementById("backBtn").innerText=tr.back;
}

function toggleLang(){
lang=lang==="en"?"zh":"en";
localStorage.setItem("hagimi_lang",lang);
apply();
}

const params = new URLSearchParams(window.location.search);
const project = getProjectById(params.get("project"));

async function submit(){

const name = document.getElementById("name").value.trim();
const contact = document.getElementById("contact").value.trim();
const amount = document.getElementById("amount").value.trim();
const notes = document.getElementById("notes").value.trim();

const status = document.getElementById("status");

if(!name || !contact || !amount){
status.innerText="Please fill required fields";
return;
}

status.innerText="Submitting...";

try{

await fetch(webhookUrl,{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({
project_id:project.id,
project_name:project.name,
name,
contact,
requested_amount:amount,
notes
})
});

status.innerText = t[lang].success;

document.getElementById("name").value="";
document.getElementById("contact").value="";
document.getElementById("amount").value="";
document.getElementById("notes").value="";

}catch(e){
status.innerText = t[lang].error;
}

}

function goBack(){
location.href="marketplace.html";
}

apply();

</script>

</body>
</html>
