<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HAGIMI Allocation Request</title>

  <meta name="theme-color" content="#0f172a" />
  <link rel="apple-touch-icon" href="hagimi-icon.png" />
  <link rel="icon" type="image/png" href="hagimi-icon.png" />

  <style>
    body {
      margin: 0;
      background:
        radial-gradient(circle at top left, rgba(59,130,246,0.18), transparent 28%),
        radial-gradient(circle at top right, rgba(14,165,233,0.16), transparent 24%),
        linear-gradient(180deg, #08111f 0%, #0b1220 45%, #0f172a 100%);
      color: #e5eefc;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: rgba(17, 27, 46, 0.92);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .sub {
      color: #9fb0cf;
      line-height: 1.6;
      margin-bottom: 18px;
    }

    .project-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 18px;
    }

    .project-label {
      color: #9fb0cf;
      font-size: 12px;
      margin-bottom: 4px;
    }

    .project-value {
      font-size: 22px;
      font-weight: 800;
    }

    input, textarea {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(255,255,255,0.04);
      color: #e5eefc;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #5fa8ff, #7dd3fc);
      color: #08111f;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: #e5eefc;
      border: 1px solid rgba(148, 163, 184, 0.18);
    }

    .status {
      margin-top: 12px;
      min-height: 20px;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Request Allocation</h1>
      <div class="sub">
        Submit your interest for this whisky-backed asset. This is a non-binding indication of interest for internal review only.
      </div>

      <div class="project-box">
        <div class="project-label">Selected Project</div>
        <div class="project-value" id="projectName">Project</div>
      </div>

      <input id="fullName" placeholder="Your full name">
      <input id="contact" placeholder="WhatsApp / WeChat / Email">
      <input id="requestedAmount" type="number" placeholder="Requested token amount">
      <textarea id="notes" placeholder="Notes / preferred structure / questions"></textarea>

      <button onclick="submitAllocation()">Submit Request</button>
      <button class="secondary" onclick="goBack()">Back to Marketplace</button>

      <div id="status" class="status"></div>
    </div>
  </div>

  <script src="projects.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("project");
    const project = getProjectById(projectId);

    document.getElementById("projectName").innerText = project.name;

    function submitAllocation() {
      const name = document.getElementById("fullName").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const requestedAmount = document.getElementById("requestedAmount").value.trim();
      const notes = document.getElementById("notes").value.trim();
      const status = document.getElementById("status");

      if (!name || !contact || !requestedAmount) {
        status.innerText = "Please complete name, contact, and requested amount.";
        return;
      }

      const allocationRequests = JSON.parse(localStorage.getItem("hagimi_allocation_requests") || "[]");

      allocationRequests.push({
        projectId: project.id,
        projectName: project.name,
        name,
        contact,
        requestedAmount,
        notes,
        submittedAt: new Date().toLocaleString()
      });

      localStorage.setItem("hagimi_allocation_requests", JSON.stringify(allocationRequests));

      status.innerText = "Allocation request submitted successfully.";

      document.getElementById("fullName").value = "";
      document.getElementById("contact").value = "";
      document.getElementById("requestedAmount").value = "";
      document.getElementById("notes").value = "";
    }

    function goBack() {
      window.location.href = "marketplace.html";
    }
  </script>
</body>
</html>
